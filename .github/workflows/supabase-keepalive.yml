name: Supabase Keepalive

on:
  schedule:
    # Daily at 14:00 UTC. Supabase pauses free projects after 7 days of
    # inactivity; a weekly ping left no margin — GitHub delayed one run by
    # ~1.5h and the project paused (Oct 2026). Daily gives 6 days of slack.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keepalive table
        run: |
          curl -sf -X POST "${SUPABASE_URL}/rest/v1/keepalive" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
