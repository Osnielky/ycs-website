name: Supabase Keepalive

on:
  schedule:
    # Every Sunday at 10:00 AM US Eastern (UTC-4 during EDT).
    # Cron runs in UTC only — no DST awareness. Once clocks fall back to EST
    # in November, this will fire at 9:00 AM ET until updated to "0 15 * * 0".
    - cron: "0 14 * * 0"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keepalive table
        run: |
          curl -sf -X POST "${SUPABASE_URL}/rest/v1/keepalive" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
